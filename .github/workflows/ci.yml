name: CI — Quality, Unit, Feature, E2E & Docker

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run strict TypeScript check
        run: bun run typecheck

  unit-tests:
    name: Unit Tests (Bracket, Scoring, Media, Sanitizers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit test suite
        run: bun run test:unit

  feature-and-e2e-tests:
    name: Feature & E2E Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run feature test suite
        run: bun run test:feature

      - name: Run full E2E & security test suite
        run: bun run test:e2e

      - name: Build production client bundle
        run: bun run build

      - name: Verify production bundle artifacts
        run: |
          test -f dist/client/index.html
          ls -lh dist/client/assets

  docker-smoke-test:
    name: Docker Build & Ephemeral Smoke Test
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests, feature-and-e2e-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: openvolley:ci-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot ephemeral container & verify HTTP endpoints
        run: |
          docker run -d \
            --name openvolley-smoke \
            -p 127.0.0.1:3000:3000 \
            -e JWT_SECRET="ci-ephemeral-secret-key-minimum-32-chars" \
            -e ADMIN_DEFAULT_PASSWORD="ci-admin-password" \
            openvolley:ci-smoke

          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:3000/api/public/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3000/api/public/health | grep -q '"ok":true'
          curl -fsSI http://127.0.0.1:3000/api/public/overview | grep -iq 'content-security-policy:'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/non-existent-route)" = "404"

      - name: Dump container logs on failure
        if: failure()
        run: docker logs openvolley-smoke || true

      - name: Remove test container and image
        if: always()
        run: |
          docker rm -f openvolley-smoke || true
          docker rmi -f openvolley:ci-smoke || true
