services:
  openvolley:
    image: ghcr.io/ardianryan/openvolley:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openvolley
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      MAX_SSE_CLIENTS: ${MAX_SSE_CLIENTS:-150}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
    volumes:
      - openvolley_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:3000/api/public/health').catch(() => null); process.exit(r && r.ok ? 0 : 1);"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  openvolley_data:
